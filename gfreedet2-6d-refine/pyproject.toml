[project]
name = "gfreedet2-6d-refine"
version = "0.1.0"
description = "GFreeDet2 6D refinement: GoTrack (mesh) and GoTrack-GS (splat), as an installable package."
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "torch",
    "torchvision",
    "pytorch-lightning",
    "pytz",
    "scikit-learn",
    "faiss-cpu",
    "kornia",
    "einops",
    "scikit-image",
    "opencv-python",
    "pillow",
    "imageio",
    "pypng",
    "plyfile",
    "trimesh",
    "pyrender",
    "pyglet==2.0.15",
    "pyopengl",
    "matplotlib==3.9.0",
    "distinctipy",
    "tqdm",
]

[project.optional-dependencies]
# The splat renderer (`make_renderer("splat")`). gsplat builds a CUDA extension at first use and needs nvcc.
splat = ["gsplat==1.5.3", "easydict"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Top-level packages `utils`, `model`, `dataloader`, `bop_toolkit_lib` and `dinov2`, as the scripts import them. `dinov2` is the vendored copy.
[tool.setuptools]
packages = [
    "utils", "model", "model.blocks", "model.heads", "model.heads.dpt", "model.heads.cnn", "model.heads.raft", "dataloader", "bop_toolkit_lib",
    "dinov2", "dinov2.hub", "dinov2.layers", "dinov2.models", "dinov2.utils",
]

[tool.setuptools.package-dir]
dinov2 = "external/dinov2/dinov2"

[tool.setuptools.package-data]
bop_toolkit_lib = ["colors.json", "*.ttf"]
